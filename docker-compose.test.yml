services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: notification_test
      POSTGRES_DB: notification_hub_test
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-15433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notification_test -d notification_hub_test']
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:-16380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15
